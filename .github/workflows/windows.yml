name: Build Windows EXE

on:
  push:
    branches: [main]
    paths: ['web/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build installer and portable exe
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: DayPlanner-windows
          path: |
            desktop/dist/*.exe
      - name: Publish portable EXE to the website (download link)
        shell: bash
        run: |
          mkdir -p web/download
          cp desktop/dist/DayPlanner-Portable.exe web/download/DayPlanner-Portable.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/download/DayPlanner-Portable.exe
          git commit -m "Update Windows EXE [skip ci]" || exit 0
          git pull --rebase origin main
          git push
