name: Build Windows EXE

on:
  push:
    branches: [main]
    paths: ['web/**', 'desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build installer and portable exe
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: DayPlanner-windows
          path: |
            desktop/dist/*.exe
      - name: Publish portable EXE as a GitHub release (too big to commit)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest -y --cleanup-tag || true
          gh release create windows-latest desktop/dist/DayPlanner-Portable.exe --title "Day Planner for Windows (latest)" --notes "Portable Windows app, built from main."
