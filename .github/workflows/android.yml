name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['web/**', 'android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Prepare Capacitor project
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          rm -rf www && cp -r ../web www && rm -f www/vercel.json www/sw.js
          npx cap add android
          mkdir -p android/app/src/main/res/raw
          cp tinker.wav android/app/src/main/res/raw/tinker.wav
          cp -r res/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk DayPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DayPlanner-apk
          path: DayPlanner.apk
